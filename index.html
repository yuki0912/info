<head>

    <!-- External Fonts & Libraries -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@400;500;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff0f5 0%, #f3e8ff 45%, #e6f0fa 100%);
            --orb-a: #ffc2d4;
            --orb-b: #d8b4fe;
            --orb-c: #bae6fd;
            --card-bg: rgba(255, 255, 255, 0.78);
            --card-border: rgba(255, 255, 255, 0.95);
            --text-primary: #3b2d3e;
            --text-secondary: #78647c;
            --accent-pink: #f472b6;
            --accent-purple: #c084fc;
            --link-bg: rgba(255, 255, 255, 0.88);
            --link-hover-bg: #ffffff;
            --shadow-color: rgba(138, 93, 126, 0.15);
            --font-family: 'Zen Maru Gothic', 'Noto Sans TC', system-ui, sans-serif;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #130f1e 0%, #1e1730 45%, #0f1929 100%);
            --orb-a: #701a75;
            --orb-b: #4c1d95;
            --orb-c: #1e3a8a;
            --card-bg: rgba(23, 18, 36, 0.82);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f5eef8;
            --text-secondary: #b5a4bd;
            --accent-pink: #f472b6;
            --accent-purple: #a855f7;
            --link-bg: rgba(35, 28, 54, 0.78);
            --link-hover-bg: rgba(50, 40, 77, 0.95);
            --shadow-color: rgba(0, 0, 0, 0.45);
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease, color 0.5s ease;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.35) 1.2px, transparent 1.2px),
                radial-gradient(rgba(0, 0, 0, 0.03) 1.2px, transparent 1.2px);
            background-size: 28px 28px;
            background-position: 0 0, 14px 14px;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(65px);
            opacity: 0.65;
            animation: floatOrb 16s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .orb-a { width: 340px; height: 340px; background: var(--orb-a); top: -80px; left: -80px; }
        .orb-b { width: 400px; height: 400px; background: var(--orb-b); top: 35%; right: -120px; animation-delay: -5s; }
        .orb-c { width: 300px; height: 300px; background: var(--orb-c); bottom: 2%; left: -60px; animation-delay: -10s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 30px) scale(1.1); }
            100% { transform: translate(-30px, 50px) scale(0.95); }
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            box-shadow: 0 24px 60px var(--shadow-color), inset 0 1px 1.5px rgba(255, 255, 255, 0.8);
            border-radius: 36px;
            transform-style: preserve-3d;
            transition: transform 0.25s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        .banner-container {
            position: relative;
            width: 100%;
            height: 160px;
            border-radius: 28px 28px 0 0;
            overflow: hidden;
            background: linear-gradient(135deg, #fbcfe8, #e9d5ff);
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-wrap {
            position: relative;
            width: 112px;
            height: 112px;
            margin: -56px auto 0 auto;
            z-index: 2;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 42% 58% 52% 48% / 46% 45% 55% 54%;
            padding: 4px;
            background: linear-gradient(135deg, #ffffff, var(--accent-pink), #ffffff);
            box-shadow: 0 12px 28px var(--shadow-color);
            animation: morphAvatar 7s ease-in-out infinite;
        }

        .avatar-ring {
            position: absolute;
            inset: -6px;
            border: 1.5px dashed var(--accent-pink);
            border-radius: 50%;
            opacity: 0.75;
            animation: spinRing 22s linear infinite;
        }

        @keyframes morphAvatar {
            0%, 100% { border-radius: 42% 58% 52% 48% / 46% 45% 55% 54%; transform: translateY(0); }
            50% { border-radius: 56% 44% 45% 55% / 50% 58% 42% 50%; transform: translateY(-4px); }
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        .social-icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 9999px;
            background: var(--link-bg);
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 12px var(--shadow-color);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .social-icon-btn:hover {
            transform: translateY(-4px) scale(1.1);
            background: var(--link-hover-bg);
            box-shadow: 0 8px 20px var(--shadow-color);
        }

        .link-card-item {
            background: var(--link-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            border-radius: 22px;
            box-shadow: 0 6px 18px var(--shadow-color);
            transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .link-card-item:hover {
            transform: translateY(-4px) scale(1.015);
            background: var(--link-hover-bg);
            box-shadow: 0 14px 30px var(--shadow-color);
        }

        .drag-item {
            cursor: grab;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .drag-item:active { cursor: grabbing; }
        .drag-item.dragging { opacity: 0.4; transform: scale(0.98); }
        .drag-over-indicator { border-top: 2.5px solid var(--accent-pink) !important; }

        .toast-msg {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 100;
        }

        .toast-msg.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>

                { id: "s4", platform: "Discord", icon: "fa-brands fa-discord", color: "text-indigo-400", url: "https://discord.gg/SNVU5a84Hb" },
                { id: "s5", platform: "Facebook", icon: "fa-brands fa-facebook", color: "text-blue-500", url: "https://www.facebook.com/otozakayuki/" },
                { id: "s6", platform: "Threads", icon: "fa-brands fa-threads", color: "text-zinc-800 dark:text-zinc-200", url: "https://www.threads.net/@otozaka_yukii85" },
                { id: "s7", platform: "Marshmallow", icon: "fa-solid fa-heart", color: "text-pink-400", url: "https://marshmallow-qa.com/otozaka_yuki85" }
            ],
            links: [
                { id: "l1", title: "𝕏 (Twitter) 官方推特", sub: "最新活動資訊與直播預告 ✦ @otozaka_yuki85", url: "https://x.com/otozaka_yuki85", icon: "fa-brands fa-x-twitter", badge: "X", themeColor: "from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-900 text-slate-800 dark:text-slate-200" },

                { id: "l5", title: "📘 Facebook 官方粉絲專頁", sub: "臉書專頁動態更新、活動消息與紀錄分享", url: "https://www.facebook.com/otozakayuki/", icon: "fa-brands fa-facebook", badge: "FB", themeColor: "from-blue-100 to-sky-200 dark:from-blue-900/40 dark:to-sky-800/40 text-blue-600 dark:text-blue-300" },
                { id: "l6", title: "🧵 Threads 隨筆紀錄", sub: "日常隨想、幕後碎碎念與即時動態交流", url: "https://www.threads.net/@otozaka_yukii85", icon: "fa-brands fa-threads", badge: "NEW", themeColor: "from-zinc-100 to-slate-200 dark:from-zinc-800 dark:to-zinc-900 text-zinc-700 dark:text-zinc-200" },
                { id: "l7", title: "🍬 棉花糖 (マシュマロ) 提問箱", sub: "匿名投稿對雪想說的話、問題諮詢與直播主題許願", url: "https://marshmallow-qa.com/otozaka_yuki85", icon: "fa-solid fa-heart", badge: "Q&A", themeColor: "from-pink-100 to-rose-200 dark:from-pink-900/40 dark:to-rose-800/40 text-pink-500 dark:text-pink-300" }
            ]
        };

        let appState = loadState();

        function loadState() {
            try {
                const saved = localStorage.getItem('otozaka_yuki_litlink_v3');
                if (saved) return JSON.parse(saved);
            } catch (e) { console.error(e); }
            return JSON.parse(JSON.stringify(DEFAULT_DATA));
        }

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class SakuraPetal {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = -20 - Math.random() * 40;
                this.size = 8 + Math.random() * 8;
                this.speedY = 0.7 + Math.random() * 1.3;
                this.speedX = -0.5 + Math.random() * 1;
                this.rotation = Math.random() * 360;
                this.spin = -1 + Math.random() * 2;
                this.opacity = 0.4 + Math.random() * 0.5;
            }
            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.01) + this.speedX;
                this.rotation += this.spin;
                if (this.y > height + 30) this.reset();
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.fillStyle = `rgba(255, 210, 225, ${this.opacity})`;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-this.size, -this.size, -this.size * 1.5, this.size / 3, 0, this.size);
                ctx.bezierCurveTo(this.size * 1.5, this.size / 3, this.size, -this.size, 0, 0);
                ctx.fill();
                ctx.restore();
            }
        }

        class SparkleStar {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = 2 + Math.random() * 4;
                this.alpha = Math.random();
                this.speed = 0.01 + Math.random() * 0.02;
                this.dir = Math.random() > 0.5 ? 1 : -1;
            }
            update() {
                this.alpha += this.speed * this.dir;
                if (this.alpha >= 1) { this.alpha = 1; this.dir = -1; }
                else if (this.alpha <= 0.1) { this.reset(); }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * 0.8})`;
                ctx.beginPath();
                ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let sakuraPetals = [];
        let sparkleStars = [];

        function renderApp() {
            const p = appState.profile;
            document.getElementById('displayName').textContent = p.name;
            document.getElementById('footerName').textContent = p.name;
            document.getElementById('displaySubname').textContent = p.subname;
            document.getElementById('displayBadge').textContent = p.badge;
            document.getElementById('displayAvatar').src = p.avatar;
            document.getElementById('displayBanner').src = p.banner;
            document.getElementById('displayBio').innerHTML = p.bio;

            document.getElementById('displayTags').innerHTML = p.tags.map(t =>
                `<span class="px-2.5 py-1 rounded-full text-[11px] bg-white/60 dark:bg-white/10 border border-white/70 dark:border-white/10 text-slate-600 dark:text-slate-300">${t}</span>`
            ).join('');

            document.getElementById('displaySocialsBar').innerHTML = appState.socials.map(s =>
                `<a href="${s.url}" target="_blank" rel="noopener" class="social-icon-btn group" title="${s.platform}">
                    <i class="${s.icon} text-lg ${s.color}"></i>
                </a>`
            ).join('');

            document.getElementById('displayLinksContainer').innerHTML = appState.links.map(l =>
                `<a href="${l.url}" target="_blank" rel="noopener" class="link-card-item p-3.5 flex items-center gap-3.5 text-left group">
                    <div class="w-11 h-11 rounded-2xl bg-gradient-to-br ${l.themeColor} flex items-center justify-center shrink-0 shadow-sm">
                        <i class="${l.icon} text-lg"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-1.5">
                            <span class="font-bold text-sm tracking-wide group-hover:text-pink-500 transition-colors truncate">${l.title}</span>
                            ${l.badge ? `<span class="px-1.5 py-0.5 rounded text-[9px] font-black bg-pink-100 dark:bg-pink-950 text-pink-600 dark:text-pink-300 border border-pink-200 shrink-0">${l.badge}</span>` : ''}
                        </div>
                        <div class="text-[11px] text-slate-500 dark:text-slate-400 truncate mt-0.5">${l.sub}</div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-pink-400 group-hover:translate-x-1 transition-transform pr-1"></i>
                </a>`
            ).join('');

            document.documentElement.setAttribute('data-theme', appState.theme);
            if (appState.theme === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');

            sakuraPetals = Array.from({ length: appState.particles.sakura }, () => new SakuraPetal());
            sparkleStars = Array.from({ length: appState.particles.sparkle }, () => new SparkleStar());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            sakuraPetals.forEach(p => { p.update(); p.draw(); });
            sparkleStars.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animateParticles);
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toastText').textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2600);
        }

        document.getElementById('themeBtn').addEventListener('click', () => {
            appState.theme = appState.theme === 'light' ? 'dark' : 'light';
            renderApp();
            showToast(`🎨 已切換主題：${appState.theme.toUpperCase()}`);
        });

        document.getElementById('shareBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href);
            showToast('✨ 連結已成功複製到剪貼簿！');
        });

        window.onload = function () {
            document.getElementById('year').textContent = new Date().getFullYear();
            renderApp();
            animateParticles();
        };
    </script>
</body>

</html>
